[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kivi"
version = "0.19.0"
description = "Kivi - local-first AI assistant for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Kivi project" }]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
gpu = [
    "nvidia-ml-py>=12.0",
]
vector = [
    "lancedb>=0.41",
    "pyarrow>=26.0",
]
operator = [
    "pywinauto>=0.6.9",
    "pyautogui>=0.9.54",
    "pycaw>=20260927",
    "comtypes>=1.5",
    "pywin32>=312",
]
browser = [
    "playwright>=1.65",
]
mail = [
    "google-api-python-client>=2.202",
    "google-auth-oauthlib>=1.5",
]
voice = [
    "faster-whisper>=1.2",
    "silero-vad>=6.2",
    "sounddevice>=0.5",
    "openwakeword>=0.6",
    "numpy>=1.26",
]

[project.scripts]
kivi = "kivi.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
