# Названия элементов AltCRM, по которым агент ищет поля (по подписи/плейсхолдеру/тексту кнопки).
# Если в вашей CRM подпись другая — поправьте здесь. Менять код не нужно.

[order]
title_regex = "Устройство\\s*#(\\d+)"      # номер устройства в заголовке карточки
edit_button = "Редактировать"        # на странице две такие кнопки (сверху слева и боковая вкладка)
add_task_button = "Добавить задачу"

[comment]
placeholder = "Напишите сообщение..."      # поле чата заказа справа

[checklist]                                  # подписи полей «Чеклист менеджера» = placeholder полей в режиме правки (подтверждено снимком 2.json)
deadline = "Согласованные сроки ремонта"
parts = "Согласованные зап. части"
works = "Фактические выполняемые работы"
risks = "Согласованные риски"

[task]                                       # окно «Добавление новой задачи»
dialog_title = "Добавление новой задачи"
create_button = "Создать задачу"
comment_placeholder = "Комментарий"
due_placeholder = "Срок выполнения"          # подтверждено снимком 4.json

[act]                                        # строки акта: работы добавляются в блок «Расчет стоимости запчастей»
block_title = "Расчет стоимости запчастей"
search_placeholder = "Поиск"                 # поле ввода названия (рядом кнопка «+»)
add_button_class = "add-form-btn"            # кнопка «+» (иконка без подписи)
name_class = "name_input"                    # поле названия
row_class = "table-row"                      # строка таблицы (подтверждено снимком 7.json)
warranty_class = "warranty-input"            # гарантия, дни
price_class = "price-input"                  # озвученная цена
